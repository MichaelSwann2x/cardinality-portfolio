[project]
name = "cardinality-portfolio"
version = "0.2.0"
description = "Improved cardinality-constrained mean-variance portfolio optimization."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4", "matplotlib>=3.7"]
solver = ["cvxpy>=1.4"]

[project.urls]
Source = "https://github.com/MichaelSwann2x/cardinality-portfolio"
Original = "https://github.com/mirkovicdev/Cardinality-Constrained-Portfolio-Optimization"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cardinality_portfolio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
